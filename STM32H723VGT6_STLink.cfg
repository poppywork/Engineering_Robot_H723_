# This is an Hurricane board with a single STM32F427IIHx chip
#
# Generated by System Workbench for STM32
# Take care that such file, as generated, may be overridden without any early notice. Please have a look to debug launch configuration setup(s)

source [find interface/stlink.cfg]

set WORKAREASIZE 0x8000

# transport select swd

set CHIPNAME STM32h723VGTx
set BOARDNAME Hurricane

source [find target/stm32h7x.cfg]

# 必须放在 source stm32h7x.cfg 之后，否则会被覆盖
# 不使用硬件复位线（ST-Link V2 未接 SRST），用软件 SYSRESETREQ
reset_config none
set CONNECT_UNDER_RESET 0

# 降低时钟频率，提高 SWD 通信稳定性
adapter speed 1000


# 启用 FreeRTOS 感知，使调试器能正确显示各线程变量
# _CHIPNAME 在 stm32h7x.cfg 中定义，目标名为 _CHIPNAME.cpu0
set _CHIPNAME $CHIPNAME
$_CHIPNAME.cpu0 configure -rtos FreeRTOS